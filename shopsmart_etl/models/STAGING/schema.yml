version: 2

models:
  - name: stg_customers
    description: "Cleaned staging table for customers"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: stg_products
    description: "Cleaned staging table for products"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
  - name: stg_orders
    description: "Cleaned staging table for orders"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
